<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Torre Manager: administración de condominios, accesos, paquetería, reservas y gastos comunes en una sola plataforma.">
  <meta name="theme-color" content="#0B1220">
  <meta name="color-scheme" content="light dark">

  <!-- Open Graph / Twitter -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Torre Manager">
  <meta property="og:title" content="Torre Manager · Administración de condominios">
  <meta property="og:description" content="Accesos, paquetería, reservas y gastos comunes en una plataforma multi-tenant para administrar tu comunidad con claridad.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Torre Manager · Administración de condominios">
  <meta name="twitter:description" content="Accesos, paquetería, reservas y gastos comunes en una plataforma multi-tenant para administrar tu comunidad con claridad.">
  <meta name="twitter:image" content="icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Torre Manager">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Torre Manager</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #070B14;
    }
    #tm-boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 78% 18%, rgba(245, 181, 68, 0.16), transparent 42%),
        radial-gradient(circle at 18% 82%, rgba(47, 91, 255, 0.28), transparent 46%),
        linear-gradient(135deg, #060A12 0%, #0B1424 55%, #131F3A 100%);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #F3F6FC;
      transition: opacity 220ms ease;
    }
    #tm-boot .tm-card {
      text-align: center;
    }
    #tm-boot .tm-mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      background: linear-gradient(135deg, #0B1220, #14264A 55%, #2F5BFF);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 18px 40px rgba(47, 91, 255, 0.35);
    }
    #tm-boot .tm-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    #tm-boot .tm-sub {
      margin-top: 6px;
      font-size: 11px;
      letter-spacing: 2.4px;
      color: rgba(243, 246, 252, 0.62);
    }
    #tm-boot .tm-bar {
      width: 168px;
      height: 4px;
      margin: 26px auto 0;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.12);
    }
    #tm-boot .tm-bar::after {
      content: "";
      display: block;
      width: 45%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #F5B544, #FFD98A);
      animation: tm-slide 1.2s ease-in-out infinite;
    }
    @keyframes tm-slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(260%); }
    }
  </style>
</head>
<body>
  <div id="tm-boot">
    <div class="tm-card">
      <div class="tm-mark">TM</div>
      <div class="tm-title">Torre Manager</div>
      <div class="tm-sub">PREMIUM CONDOMINIUM OPS</div>
      <div class="tm-bar"></div>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('tm-boot');
      if (!boot) return;
      boot.style.opacity = '0';
      setTimeout(function () { boot.remove(); }, 240);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
